name: application-ci-with-roottrace

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and RootTrace
        run: |
          python -m pip install -r requirements.txt
          python -m pip install /path/to/roottrace

      - name: Run tests and keep artifacts
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -vv --junitxml=junit.xml 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Analyze failure artifact with RootTrace
        if: always()
        shell: bash
        run: |
          roottrace init
          if [ -s junit.xml ]; then
            roottrace analyze junit.xml
          else
            roottrace analyze pytest.log
          fi

      - name: Upload RootTrace reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roottrace-reports
          path: .roottrace/reports/

      - name: Preserve original test result
        if: always()
        shell: bash
        run: exit "${{ steps.tests.outputs.exit_code }}"
